plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def hasReleaseKeystore = keystorePropertiesFile.exists() && keystoreProperties['storeFile']

// IMP-052: a release build ALWAYS requires android/key.properties (with
// storeFile). Any assemble/bundle/package…Release task fails loudly before it
// runs; there is no debug-key fallback. Debug/profile builds are unaffected
// (the check only fires when a Release task is in the task graph).
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKeystore &&
            graph.allTasks.any { it.name =~ /^(assemble|bundle|package)\w*Release$/ }) {
        throw new GradleException(
                'Release signing is required: android/key.properties (with storeFile) is missing ' +
                'or incomplete. Refusing to build a release APK/AAB (no debug-key fallback). ' +
                'Create android/key.properties (keyAlias, keyPassword, storeFile, storePassword).')
    }
}

android {
    compileSdk 36
    ndkVersion "28.2.13676358"
    namespace "com.sunfire.app"
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // IzzyOnDroid / F-Droid: do not embed Google's encrypted dependency tree blob.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.sunfire.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                cppFlags "-Wl,-z,max-page-size=16384"
            }
        }
    }

    packagingOptions {
        jniLibs {
            // Compress native libs in the APK so split ABI builds stay closer to
            // IzzyOnDroid's ~30 MB per-app file-size guideline.
            useLegacyPackaging true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // IMP-052: never the debug key. Without key.properties the
            // taskGraph check above stops any Release task before it runs.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
        force 'androidx.browser:browser:1.8.0'
    }
    // IMP-051b: `exclude group: 'com.google.android.gms'` was added in 13ad452
    // (2026-09-11, "FOSS" commit that also dropped cronet_http, whose
    // play-services-cronet was the only gms user then). ML Kit text
    // recognition (added later, 851392c) needs play-services-base / -basement
    // / -tasks / -mlkit-text-recognition(-common); every gms module now on the
    // release classpath comes from ML Kit, so the exclude is removed rather
    // than narrowed. (A FOSS/F-Droid build would need a flavor without ML Kit.)
}
