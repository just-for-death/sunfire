workflows:
  android-release:
    name: Android Release APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up local properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run unit & widget tests
        script: |
          flutter test
      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients: []

  ios-unsigned-release:
    name: iOS Unsigned IPA Build (Sideload / AltStore / TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Run unit & widget tests
        script: |
          flutter test
      - name: Build iOS release bundle (unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA for sideloading
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 Sunfire-unsigned.ipa Payload
          mv Sunfire-unsigned.ipa "$CM_BUILD_DIR/build/ios/iphoneos/Sunfire-unsigned.ipa"
    artifacts:
      - build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients: []

  all-platforms-release:
    name: Sunfire Multi-Platform Release (APK & IPA)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up local properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run unit & widget tests
        script: |
          flutter test
      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-shrink
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS release bundle (unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 Sunfire-unsigned.ipa Payload
          mv Sunfire-unsigned.ipa "$CM_BUILD_DIR/build/ios/iphoneos/Sunfire-unsigned.ipa"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/iphoneos/*.ipa
    publishing:
      email:
        recipients: []
