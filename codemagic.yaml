# ==============================================================================
# Codemagic CI/CD for Sunfire Manga Reader — v4.0.0
# Supports: Android (Universal & Split APKs) & iOS (Unsigned Sideload IPA)
# ==============================================================================

workflows:

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 1: ANDROID RELEASE (Linux x2 — Fast & Lightweight)
  # ────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (Universal & Split APKs) - v4.0.0
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.47.0
      java: 17
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
        # Refuse to produce a debug-signed "release": every APK from CI must
        # carry the persistent release key so updates install over the
        # previous version instead of forcing an uninstall.
        REQUIRE_RELEASE_SIGNING: 'true'
      # Required secret env vars (Codemagic UI → Environment variables):
      #   SUNFIRE_KEYSTORE_BASE64 — base64 of android/sunfire-release.jks
      #   SUNFIRE_KEYSTORE_PASSWORD, SUNFIRE_KEY_ALIAS, SUNFIRE_KEY_PASSWORD
      # The Inject-keystore step below materializes android/key.properties
      # from them and fails loudly if they are missing.
      # Release cert SHA-256 (verify with:
      # apksigner verify --print-certs <apk>):
      #   455c1f55be9f0603b93346f42a37c49d5a3e43faa997f980866389a3b368f775
      # If an APK shows any other digest, it was NOT signed with the release
      # key and will force users through an uninstall to update.
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Set up Android SDK local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Inject release keystore from CI secrets
        script: |
          set -e
          if [ -z "$SUNFIRE_KEYSTORE_BASE64" ] || [ -z "$SUNFIRE_KEYSTORE_PASSWORD" ]; then
            echo "❌ Missing release-signing secrets. In Codemagic: Teams → your team →" >&2
            echo "   Environment variables, add SUNFIRE_KEYSTORE_BASE64 (base64 of" >&2
            echo "   android/sunfire-release.jks), SUNFIRE_KEYSTORE_PASSWORD," >&2
            echo "   SUNFIRE_KEY_ALIAS and SUNFIRE_KEY_PASSWORD." >&2
            exit 1
          fi
          echo "$SUNFIRE_KEYSTORE_BASE64" | base64 -d > "$CM_BUILD_DIR/android/sunfire-release.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$SUNFIRE_KEYSTORE_PASSWORD
          keyPassword=${SUNFIRE_KEY_PASSWORD:-$SUNFIRE_KEYSTORE_PASSWORD}
          keyAlias=${SUNFIRE_KEY_ALIAS:-sunfire}
          storeFile=../sunfire-release.jks
          EOF
          echo "✅ Release keystore injected."
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android Universal APK
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          flutter build apk --release --android-skip-build-dependency-validation --obfuscate --split-debug-info="$CM_BUILD_DIR/symbols"
          mv build/app/outputs/flutter-apk/app-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-universal.apk"
      - name: Build Android Split-per-ABI APKs
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation --obfuscate --split-debug-info="$CM_BUILD_DIR/symbols"
          cd build/app/outputs/flutter-apk
          [ -f app-arm64-v8a-release.apk ] && mv app-arm64-v8a-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-arm64-v8a.apk"
          [ -f app-armeabi-v7a-release.apk ] && mv app-armeabi-v7a-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-armeabi-v7a.apk"
          [ -f app-x86_64-release.apk ] && mv app-x86_64-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-x86_64.apk"
          ls -lh "$CM_BUILD_DIR/release/"
    artifacts:
      - release/Sunfire-*.apk

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 2: iOS RELEASE (Mac Mini M2 — AltStore / TrollStore / Sideloadly)
  # ────────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS IPA (Unsigned Sideload) - v4.0.0
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build iOS xcarchive (No code signing required)
        script: |
          set -e
          flutter build ipa --release --no-codesign
      - name: Package Unsigned Sunfire.ipa
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            echo "Existing IPA found from flutter build: ${ipas[0]}"
            mv "${ipas[0]}" "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa"
          else
            echo "Packaging Sunfire.ipa directly from xcarchive payload..."
            APP_DIR=$(find build/ios/archive -type d -name "*.app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              echo "Found app payload at: $APP_DIR"
              rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
              cp -R "$APP_DIR" /tmp/sunfire-ipa/Payload/
              (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa" Payload)
              echo "✅ Successfully created Sunfire-v${VERSION}.ipa"
            else
              echo "❌ Error: Could not find .app bundle in build/ios/archive!" >&2
              exit 1
            fi
          fi
          ls -lh "$CM_BUILD_DIR/release/"
    artifacts:
      - release/Sunfire-*.ipa

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 3: ALL PLATFORMS (Unified CI — Triggered on Tags and Main)
  # ────────────────────────────────────────────────────────────────────────────
  all-release:
    name: Multi-Platform Release (APK & IPA) - v4.0.0
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.0
      xcode: latest
      java: 17
      cocoapods: default
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
        # Same release-signing gate as android-release: CI APKs must carry
        # the persistent key (see SUNFIRE_KEYSTORE_* secrets documented there).
        REQUIRE_RELEASE_SIGNING: 'true'
    triggering:
      events:
        - tag
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Set up Android SDK local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Inject release keystore from CI secrets
        script: |
          set -e
          if [ -z "$SUNFIRE_KEYSTORE_BASE64" ] || [ -z "$SUNFIRE_KEYSTORE_PASSWORD" ]; then
            echo "❌ Missing release-signing secrets (SUNFIRE_KEYSTORE_BASE64 / SUNFIRE_KEYSTORE_PASSWORD / SUNFIRE_KEY_ALIAS / SUNFIRE_KEY_PASSWORD)." >&2
            exit 1
          fi
          echo "$SUNFIRE_KEYSTORE_BASE64" | base64 -d > "$CM_BUILD_DIR/android/sunfire-release.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$SUNFIRE_KEYSTORE_PASSWORD
          keyPassword=${SUNFIRE_KEY_PASSWORD:-$SUNFIRE_KEYSTORE_PASSWORD}
          keyAlias=${SUNFIRE_KEY_ALIAS:-sunfire}
          storeFile=../sunfire-release.jks
          EOF
          echo "✅ Release keystore injected."
      - name: Get Flutter packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build Android Universal & Split APKs
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          flutter build apk --release --android-skip-build-dependency-validation --obfuscate --split-debug-info="$CM_BUILD_DIR/symbols"
          mv build/app/outputs/flutter-apk/app-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-universal.apk"
          cd "$CM_BUILD_DIR"
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation --obfuscate --split-debug-info="$CM_BUILD_DIR/symbols"
          cd build/app/outputs/flutter-apk
          [ -f app-arm64-v8a-release.apk ] && mv app-arm64-v8a-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-arm64-v8a.apk"
          [ -f app-armeabi-v7a-release.apk ] && mv app-armeabi-v7a-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-armeabi-v7a.apk"
          [ -f app-x86_64-release.apk ] && mv app-x86_64-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-x86_64.apk"
          cd "$CM_BUILD_DIR"
          ls -lh "$CM_BUILD_DIR/release/"
      - name: Build iOS unsigned xcarchive & IPA
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          flutter build ipa --release --no-codesign
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            mv "${ipas[0]}" "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa"
          else
            APP_DIR=$(find build/ios/archive -type d -name "*.app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
              cp -R "$APP_DIR" /tmp/sunfire-ipa/Payload/
              (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa" Payload)
            fi
          fi
          ls -lh "$CM_BUILD_DIR/release/"
    artifacts:
      - release/Sunfire-*.apk
      - release/Sunfire-*.ipa
