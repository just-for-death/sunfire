# CodeMagic CI for Sunfire / Catalyst (v1.0.0+1)
# Automated build pipeline for Android APKs and iOS unsigned IPA
workflows:

  # ── 1. Android Release (APKs + App Bundle) ──────────────────────────────────
  android-release:
    name: Sunfire Android Release v1.0.0
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get packages & dependencies
        script: flutter pub get

      - name: Generate Isar Schemas
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build Universal Release APK
        script: flutter build apk --release

      - name: Build Split-per-ABI Release APKs (arm64, armv7, x86_64)
        script: flutter build apk --release --split-per-abi

      - name: Build Release App Bundle (AAB)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-x86_64-release.apk
      - build/app/outputs/bundle/release/app-release.aab

  # ── 2. iOS Release (Unsigned IPA for AltStore / Sideloadly / TrollStore) ───
  ios-release:
    name: Sunfire iOS IPA v1.0.0 (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages & dependencies
        script: flutter pub get

      - name: Generate Isar Schemas
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build Unsigned IPA
        script: |
          set -e
          flutter build ipa --release --no-codesign

      - name: Package Sunfire.ipa Artifact
        script: |
          set -e
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            mv "${ipas[0]}" build/ios/ipa/Sunfire.ipa
          elif [ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]; then
            echo "Packaging from xcarchive..."
            rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app /tmp/sunfire-ipa/Payload/
            (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/build/ios/ipa/Sunfire.ipa" Payload)
          else
            echo "No .ipa or xcarchive bundle found" >&2
            exit 1
          fi
          ls -lh build/ios/ipa/Sunfire.ipa
    artifacts:
      - build/ios/ipa/Sunfire.ipa
      - build/ios/archive/*.xcarchive

  # ── 3. Combined Multi-Platform Release (Triggered on Tags v*) ───────────────
  all-release:
    name: Sunfire Multi-Platform Release v1.0.0 (APK + IPA)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      java: 17
      cocoapods: default
    triggering:
      events:
        - tag
        - push
      tag_patterns:
        - pattern: 'v*'
          include: true
      branch_patterns:
        - pattern: 'main'
          include: false
    scripts:
      - name: Get packages & dependencies
        script: flutter pub get

      - name: Generate Isar Schemas
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APKs (Universal & Split-per-ABI)
        script: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Build iOS Unsigned IPA
        script: |
          set -e
          flutter build ipa --release --no-codesign
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            mv "${ipas[0]}" build/ios/ipa/Sunfire.ipa
          elif [ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]; then
            rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app /tmp/sunfire-ipa/Payload/
            (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/build/ios/ipa/Sunfire.ipa" Payload)
          fi
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-x86_64-release.apk
      - build/ios/ipa/Sunfire.ipa
      - build/ios/archive/*.xcarchive
