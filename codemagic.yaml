# ==============================================================================
# Codemagic CI/CD for Sunfire Manga Reader — v5.0.0
# Copied from Catalyst's approach
# ==============================================================================

workflows:

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 1: ANDROID RELEASE APKs
  # ────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release APKs - v5.0.0
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.47.0
      java: 17

    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build release APKs
        script: flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-x86_64-release.apk

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 2: iOS UNSIGNED IPA (AltStore / TrollStore / Sideloadly)
  # ────────────────────────────────────────────────────────────────────────────
  ios-unsigned-ipa:
    name: iOS Unsigned IPA (Sideload) - v5.0.0
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build IPA unsigned (no code signing)
        script: |
          set -e
          flutter build ipa --release --no-codesign
      - name: Prepare Sunfire.ipa artifact
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            mv "${ipas[0]}" build/ios/ipa/Sunfire-v${VERSION}.ipa
          elif [ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]; then
            echo "IPA missing from flutter output; packaging from xcarchive..."
            rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app /tmp/sunfire-ipa/Payload/
            (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/build/ios/ipa/Sunfire-v${VERSION}.ipa" Payload)
          else
            echo "No .ipa or xcarchive app bundle found" >&2
            exit 1
          fi
          ls -lh build/ios/ipa/Sunfire-v${VERSION}.ipa

    artifacts:
      - build/ios/ipa/Sunfire-v${VERSION}.ipa
      - build/ios/archive/*.xcarchive

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 3: BOTH PLATFORMS — triggers on v* tags
  # ────────────────────────────────────────────────────────────────────────────
  all-release:
    name: iOS + Android v5.0.0 (unsigned IPA)
    max_build_duration: 90
    instance_type: mac_mini_m1
    environment:
      flutter: 3.47.0
      xcode: latest
      java: 17
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APKs
        script: flutter build apk --release --split-per-abi
      - name: Build IPA unsigned (no code signing)
        script: |
          set -e
          flutter build ipa --release --no-codesign
      - name: Prepare Sunfire.ipa artifact
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            mv "${ipas[0]}" build/ios/ipa/Sunfire-v${VERSION}.ipa
          elif [ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]; then
            echo "IPA missing from flutter output; packaging from xcarchive..."
            rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app /tmp/sunfire-ipa/Payload/
            (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/build/ios/ipa/Sunfire-v${VERSION}.ipa" Payload)
          else
            echo "No .ipa or xcarchive app bundle found" >&2
            exit 1
          fi
          ls -lh build/ios/ipa/Sunfire-v${VERSION}.ipa

    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-x86_64-release.apk
      - build/ios/ipa/Sunfire-v${VERSION}.ipa
      - build/ios/archive/*.xcarchive