# ==============================================================================
# Codemagic CI/CD for Sunfire Manga Reader — v1.0.0
# Supports: Android (Universal & Split APKs) & iOS (Unsigned Sideload IPA)
# ==============================================================================

workflows:

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 1: ANDROID RELEASE (Linux x2 — Fast & Lightweight)
  # ────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (Universal & Split APKs) - v1.0.0
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Set up Android SDK local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android Universal APK
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          flutter build apk --release --android-skip-build-dependency-validation --obfuscate --split-debug-info="$CM_BUILD_DIR/symbols"
          mv build/app/outputs/flutter-apk/app-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-universal.apk"
      - name: Build Android Split-per-ABI APKs
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation --obfuscate --split-debug-info="$CM_BUILD_DIR/symbols"
          cd build/app/outputs/flutter-apk
          [ -f app-arm64-v8a-release.apk ] && mv app-arm64-v8a-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-arm64-v8a.apk"
          [ -f app-armeabi-v7a-release.apk ] && mv app-armeabi-v7a-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-armeabi-v7a.apk"
          [ -f app-x86_64-release.apk ] && mv app-x86_64-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-x86_64.apk"
          ls -lh "$CM_BUILD_DIR/release/"
    artifacts:
      - release/Sunfire-*.apk

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 2: iOS RELEASE (Mac Mini M2 — AltStore / TrollStore / Sideloadly)
  # ────────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS IPA (Unsigned Sideload) - v1.0.0
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build iOS xcarchive (No code signing required)
        script: |
          set -e
          flutter build ipa --release --no-codesign
      - name: Package Unsigned Sunfire.ipa
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            echo "Existing IPA found from flutter build: ${ipas[0]}"
            mv "${ipas[0]}" "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa"
          else
            echo "Packaging Sunfire.ipa directly from xcarchive payload..."
            APP_DIR=$(find build/ios/archive -type d -name "*.app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              echo "Found app payload at: $APP_DIR"
              rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
              cp -R "$APP_DIR" /tmp/sunfire-ipa/Payload/
              (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa" Payload)
              echo "✅ Successfully created Sunfire-v${VERSION}.ipa"
            else
              echo "❌ Error: Could not find .app bundle in build/ios/archive!" >&2
              exit 1
            fi
          fi
          ls -lh "$CM_BUILD_DIR/release/"
    artifacts:
      - release/Sunfire-*.ipa

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 3: ALL PLATFORMS (Unified CI — Triggered on Tags and Main)
  # ────────────────────────────────────────────────────────────────────────────
  all-release:
    name: Multi-Platform Release (APK & IPA) - v1.0.0
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      java: 17
      cocoapods: default
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
        # GitHub token with `repo` scope. Add it as a SECRET in Codemagic →
        # Environment variables (name: GITHUB_TOKEN). Used to publish the
        # release artifacts to GitHub Releases; if unset, publishing is skipped.
        GITHUB_TOKEN: $GITHUB_TOKEN
    triggering:
      events:
        - tag
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Set up Android SDK local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build Android Universal & Split APKs
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          flutter build apk --release --android-skip-build-dependency-validation --obfuscate --split-debug-info="$CM_BUILD_DIR/symbols"
          mv build/app/outputs/flutter-apk/app-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-universal.apk"
          cd "$CM_BUILD_DIR"
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation --obfuscate --split-debug-info="$CM_BUILD_DIR/symbols"
          cd build/app/outputs/flutter-apk
          [ -f app-arm64-v8a-release.apk ] && mv app-arm64-v8a-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-arm64-v8a.apk"
          [ -f app-armeabi-v7a-release.apk ] && mv app-armeabi-v7a-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-armeabi-v7a.apk"
          [ -f app-x86_64-release.apk ] && mv app-x86_64-release.apk "$CM_BUILD_DIR/release/Sunfire-v${VERSION}-x86_64.apk"
          cd "$CM_BUILD_DIR"
          ls -lh "$CM_BUILD_DIR/release/"
      - name: Build iOS unsigned xcarchive & IPA
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          flutter build ipa --release --no-codesign
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            mv "${ipas[0]}" "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa"
          else
            APP_DIR=$(find build/ios/archive -type d -name "*.app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
              cp -R "$APP_DIR" /tmp/sunfire-ipa/Payload/
              (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa" Payload)
            fi
          fi
          ls -lh "$CM_BUILD_DIR/release/"
      - name: Generate changelog from git log
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          # Make sure previous tags are available for the changelog range
          git fetch --tags --quiet 2>/dev/null || true
          if [ -n "${CM_TAG}" ]; then
            # Commits since the previous tag (or last 60 if none yet)
            PREV_TAG=$(git describe --tags --abbrev=0 "${CM_TAG}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              {
                echo "# Sunfire ${CM_TAG}"
                echo ""
                echo "Changes since ${PREV_TAG}:"
                echo ""
                git log --oneline --no-merges "${PREV_TAG}..${CM_TAG}"
              } > changelog.md
            else
              {
                echo "# Sunfire ${CM_TAG}"
                echo ""
                echo "No previous release tag found — showing recent commits:"
                echo ""
                git log --oneline --no-merges -60 "${CM_TAG}"
              } > changelog.md
            fi
          else
            # Not a tag build; still write a fallback changelog
            {
              echo "# Sunfire (build)"
              echo ""
              git log --oneline --no-merges -20
            } > changelog.md
          fi
          echo "Changelog:"
          sed -n '1,25p' changelog.md
      - name: Publish to GitHub Release
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          if [ -z "${CM_TAG}" ]; then
            echo "Not a tag build — skipping GitHub release."
            exit 0
          fi
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "GITHUB_TOKEN is not set — skipping GitHub release."
            echo "Add a secret GITHUB_TOKEN (repo scope) in Codemagic → Environment variables."
            exit 0
          fi
          shopt -s nullglob
          artifacts=(release/Sunfire-*.apk release/Sunfire-*.ipa)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No artifacts found to publish — skipping GitHub release."
            exit 1
          fi
          echo "Publishing release ${CM_TAG} with artifacts:"
          printf '  %s\n' "${artifacts[@]}"
          if gh release view "${CM_TAG}" >/dev/null 2>&1; then
            echo "Release already exists — updating notes and uploading missing artifacts."
            gh release edit "${CM_TAG}" --notes-file changelog.md --title "Sunfire ${CM_TAG}"
            gh release upload "${CM_TAG}" "${artifacts[@]}" --clobber
          else
            gh release create "${CM_TAG}" \
              --title "Sunfire ${CM_TAG}" \
              --notes-file changelog.md \
              "${artifacts[@]}"
          fi
          echo "✅ Published: https://github.com/just-for-death/sunfire/releases/tag/${CM_TAG}"
    artifacts:
      - release/Sunfire-*.apk
      - release/Sunfire-*.ipa
