# ==============================================================================
# Codemagic CI/CD for Sunfire Manga Reader — v5.0.0
#
# Signing model (local-only by design): the persistent Android release key
# lives on the release machine (gitignored, never committed) and CI has no
# access to it — so CI MUST NOT emit installable APKs. Every CI-built APK
# would carry a random debug certificate and force an uninstall to update.
# CI therefore only VERIFIES (analyze + test + debug compile); installable
# release APKs are built locally (see README "Release signing").
# Release cert SHA-256: 455c1f55be9f0603b93346f42a37c49d5a3e43faa997f980866389a3b368f775
# ==============================================================================

workflows:

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 1: ANDROID VERIFY (Linux x2 — analyze + test + debug compile)
  # ────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android Verify (Analyze, Test, Debug Build) - v5.0.0
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.47.0
      java: 17
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
    # NOTE: release signing uses a LOCAL-ONLY key (android/sunfire-release.jks
    # + android/key.properties, both gitignored, never committed). CI has no
    # access to it by design, so this workflow collects NO APK artifacts:
    # without the release key any APK would be wrongly signed. Installable
    # release APKs are built locally: see README "Release signing".
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Set up Android SDK local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Pre-install Android NDK (retried)
        script: |
          # flutter_qjs pins no ndkVersion, so AGP falls back to its default
          # NDK r27 (27.0.12077973) and auto-installs it on first Gradle run.
          # That single-shot download has arrived corrupt before (ZipException
          # -> InstallFailedException), killing the whole build. Install it
          # explicitly with retries so one bad download cannot fail the build.
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # sdkmanager is not on PATH on all builder images (notably macOS):
          # resolve it under the SDK root explicitly.
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager not found under $SDK_ROOT/cmdline-tools." >&2
            ls "$SDK_ROOT" >&2 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          for i in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;27.0.12077973"; then
              break
            fi
            echo "sdkmanager NDK attempt $i failed, clearing partial download and retrying..."
            rm -rf "$SDK_ROOT/.temp" "$SDK_ROOT/ndk/27.0.12077973"
            sleep 5
            if [ "$i" = 3 ]; then exit 1; fi
          done
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build Linux debug for native test libs (best-effort)
        script: |
          # QuickJS-backed tests load libflutter_qjs_plugin.so from a Linux
          # debug build when present and skip gracefully when absent.
          flutter build linux --debug || echo "⚠️ Linux debug build unavailable; native tests will skip."
      - name: Test
        script: |
          # Repo baseline (see dart_test.yaml): native tests need
          # libflutter_qjs_plugin.so and network tests need a live
          # Suwayomi server + FlareSolverr — neither exists on builders.
          flutter test --exclude-tags native,network --exclude-tags network  # native runs: Linux debug build above
      - name: Debug compile check (no artifacts)
        script: |
          # Proves the Android native build compiles. The APK is deliberately
          # NOT collected: without the release key it would be a wrongly-signed
          # artifact. See the header comment.
          flutter build apk --debug --android-skip-build-dependency-validation

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 2: iOS RELEASE (Mac Mini M2 — AltStore / TrollStore / Sideloadly)
  # ────────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS IPA (Unsigned Sideload) - v5.0.0
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build iOS xcarchive (No code signing required)
        script: |
          set -e
          flutter build ipa --release --no-codesign
      - name: Package Unsigned Sunfire.ipa
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            echo "Existing IPA found from flutter build: ${ipas[0]}"
            mv "${ipas[0]}" "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa"
          else
            echo "Packaging Sunfire.ipa directly from xcarchive payload..."
            APP_DIR=$(find build/ios/archive -type d -name "*.app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              echo "Found app payload at: $APP_DIR"
              rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
              cp -R "$APP_DIR" /tmp/sunfire-ipa/Payload/
              (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa" Payload)
              echo "✅ Successfully created Sunfire-v${VERSION}.ipa"
            else
              echo "❌ Error: Could not find .app bundle in build/ios/archive!" >&2
              exit 1
            fi
          fi
          ls -lh "$CM_BUILD_DIR/release/"
    artifacts:
      - release/Sunfire-*.ipa

  # ────────────────────────────────────────────────────────────────────────────
  # WORKFLOW 3: ALL PLATFORMS (Unified CI — Triggered on Tags and Main)
  # Verifies everything, then builds the unsigned sideload IPA only.
  # No APK artifacts: without the local-only release key any APK would be
  # wrongly signed (see the header comment).
  # ────────────────────────────────────────────────────────────────────────────
  all-release:
    name: Multi-Platform Verify + iOS IPA - v5.0.0
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.0
      xcode: latest
      java: 17
      cocoapods: default
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
    triggering:
      events:
        - tag
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Set up Android SDK local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Pre-install Android NDK (retried)
        script: |
          # Same AGP-default-NDK pin as android-release: install r27 up front
          # with retries instead of letting Gradle's single-shot auto-install
          # fail the build on a corrupt download.
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # sdkmanager is not on PATH on all builder images (notably macOS):
          # resolve it under the SDK root explicitly.
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager not found under $SDK_ROOT/cmdline-tools." >&2
            ls "$SDK_ROOT" >&2 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          for i in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;27.0.12077973"; then
              break
            fi
            echo "sdkmanager NDK attempt $i failed, clearing partial download and retrying..."
            rm -rf "$SDK_ROOT/.temp" "$SDK_ROOT/ndk/27.0.12077973"
            sleep 5
            if [ "$i" = 3 ]; then exit 1; fi
          done
      - name: Get Flutter packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: |
          # Repo baseline (see dart_test.yaml): native tests need
          # libflutter_qjs_plugin.so and network tests need a live
          # Suwayomi server + FlareSolverr — neither exists on builders.
          flutter test --exclude-tags native,network --exclude-tags native,network  # no Linux build in this workflow
      - name: Debug compile check (no artifacts)
        script: |
          # Proves the Android native build compiles. The APK is deliberately
          # NOT collected: without the release key it would be a wrongly-signed
          # artifact. See the header comment.
          flutter build apk --debug --android-skip-build-dependency-validation
      - name: Build iOS unsigned xcarchive & IPA
        script: |
          set -e
          VERSION=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | sed -e 's/version: //' -e 's/["'\'']//g' -e 's/+.*//' -e 's/ //g')
          mkdir -p "$CM_BUILD_DIR/release"
          flutter build ipa --release --no-codesign
          mkdir -p build/ios/ipa
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -gt 0 ]; then
            mv "${ipas[0]}" "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa"
          else
            APP_DIR=$(find build/ios/archive -type d -name "*.app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              rm -rf /tmp/sunfire-ipa && mkdir -p /tmp/sunfire-ipa/Payload
              cp -R "$APP_DIR" /tmp/sunfire-ipa/Payload/
              (cd /tmp/sunfire-ipa && zip -qr "$CM_BUILD_DIR/release/Sunfire-v${VERSION}.ipa" Payload)
            fi
          fi
          ls -lh "$CM_BUILD_DIR/release/"
    artifacts:
      - release/Sunfire-*.ipa
