name: sunfire
description: Sunfire - A local-first, server-synced manga reader.

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  app_links: ^6.4.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  dynamic_color: ^1.7.0
  extended_image: ^9.0.0
  file_picker: ^8.1.4
  flex_color_scheme: ^8.2.0
  flutter:
    sdk: flutter
  flutter_qjs: ^0.3.7
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_cache_manager: ^3.4.1
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^8.2.8
  font_awesome_flutter: ^11.0.0
  gap: ^3.0.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  graphql: ^5.2.0-beta.10
  graphql_flutter: ^5.2.0-beta.8
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  logger: ^2.5.0
  package_info_plus: ^8.1.2
  palette_generator: ^0.3.3+4
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  riverpod_annotation: ^2.6.1
  sentry_flutter: ^8.13.0
  shared_preferences: ^2.3.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8
  web_socket_channel: ^3.0.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1

dependency_overrides:
  ffi: ^2.1.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/icons/launcher/
    - assets/extensions/

flutter_gen:
  output: lib/src/constants/gen/

flutter_native_splash:
  color: "#54C5F8"
  image: assets/icons/dark_icon.png
  color_dark: "#01579B"
  image_dark: assets/icons/light_icon.png
  android_12:
    color: "#54C5F8"
    color_dark: "#01579B"
    icon_background_color: "#54C5F8"
    icon_background_color_dark: "#01579B"
    image: assets/icons/dark_icon.png
    image_dark: assets/icons/light_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/launcher/catalyst_icon.png"
  adaptive_icon_background: "#1C1C1E"
  adaptive_icon_foreground: "assets/icons/launcher/catalyst_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/launcher/catalyst_icon_monochrome.png"

  web:
    generate: true
    image_path: "assets/icons/launcher/catalyst_icon.png"
    background_color: "#54C5F8"
    theme_color: "#54C5F8"
  windows:
    generate: true
    image_path: "assets/icons/launcher/catalyst_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/launcher/catalyst_icon.png"
